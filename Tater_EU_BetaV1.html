<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stage Comparison Tool</title>
<style>
:root {
  --bg: #111118; --panel: #1a1a24; --border: #2a2a3a; --text: #d4d4dc;
  --dim: #6b6b7b; --accent: #4a9eff; --accent2: #2dd4a8;
  --hover: #252535; --input-bg: #22222e; --danger: #e63946; --warn: #e8a735;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
       background:var(--bg); color:var(--text); display:flex; height:100vh;
       overflow:hidden; font-size:13px; }

/* ── Sidebar ─────────────────────────────────────────────────── */
#sidebar { width:300px; min-width:300px; background:var(--panel);
           border-right:1px solid var(--border); display:flex;
           flex-direction:column; overflow:hidden; }
.panel-header { padding:16px; border-bottom:1px solid var(--border); }
.panel-header h1 { font-size:15px; font-weight:600; color:#fff; margin-bottom:2px; }
.panel-header p { font-size:11px; color:var(--dim); }
.panel-section { padding:12px 16px; border-bottom:1px solid var(--border); }
.panel-section h3 { font-size:11px; text-transform:uppercase; letter-spacing:.8px;
                     color:var(--dim); margin-bottom:10px; font-weight:600; cursor:default; }
#venue-list { flex:1; overflow-y:auto; padding:8px 0; }
#venue-list::-webkit-scrollbar { width:6px; }
#venue-list::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }

/* ── Buttons / Inputs ────────────────────────────────────────── */
.btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px;
       border-radius:6px; border:1px solid var(--border); background:var(--input-bg);
       color:var(--text); cursor:pointer; font-size:12px; transition:background .15s; }
.btn:hover { background:var(--hover); }
.btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
.btn.primary:hover { background:#3a8ae8; }
.btn.sm { padding:4px 8px; font-size:11px; }
.btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
input[type="number"], input[type="text"], select {
  background:var(--input-bg); border:1px solid var(--border); color:var(--text);
  padding:5px 8px; border-radius:4px; font-size:12px; width:100%; }
input[type="number"]:focus, input[type="text"]:focus { outline:none; border-color:var(--accent); }
label { font-size:12px; color:var(--dim); display:block; margin-bottom:4px; }

/* ── Upload area ─────────────────────────────────────────────── */
#upload-area { border:2px dashed var(--border); border-radius:8px; padding:20px;
               text-align:center; cursor:pointer; transition:border-color .2s, background .2s; }
#upload-area:hover, #upload-area.dragover { border-color:var(--accent);
               background:rgba(74,158,255,.06); }
#upload-area p { color:var(--dim); font-size:11px; margin-top:4px; }
#upload-area .icon { font-size:22px; opacity:.4; }

/* ── Calibration (collapsible) ───────────────────────────────── */
.cal-header { display:flex; align-items:center; gap:6px; cursor:pointer;
              user-select:none; margin-bottom:0; }
.cal-header:hover { color:var(--accent); }
.cal-arrow { font-size:10px; transition:transform .2s; display:inline-block; }
.cal-arrow.open { transform:rotate(90deg); }
.cal-body { overflow:hidden; max-height:0; transition:max-height .3s ease; }
.cal-body.open { max-height:400px; }
.cal-status { display:flex; align-items:center; gap:8px; padding:6px 0; font-size:12px; }
.cal-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
.cal-dot.done { background:var(--accent2); }
.cal-dot.pending { background:var(--dim); }
.cal-dot.active { background:var(--accent); animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
.cal-row { display:flex; gap:8px; align-items:center; margin-top:8px; }
.cal-row input { width:80px; }

/* ── Venue items ─────────────────────────────────────────────── */
.venue-item { padding:8px 16px; transition:background .15s; }
.venue-item:hover { background:var(--hover); }
.venue-row { display:flex; align-items:center; gap:8px; }
.venue-swatch { width:14px; height:14px; border-radius:3px; flex-shrink:0;
                cursor:pointer; border:2px solid transparent; transition:border-color .15s;
                display:flex; align-items:center; justify-content:center;
                font-size:10px; color:#fff; font-weight:700; line-height:1; }
.venue-swatch.on { border-color:rgba(255,255,255,.5); }
.venue-name { flex:1; font-size:12px; font-weight:500; cursor:pointer; user-select:none; }
.venue-name.disabled { opacity:.4; }
.venue-detail { font-size:10px; color:var(--dim); margin-left:22px; margin-top:2px; }
.venue-controls { margin-left:22px; margin-top:6px; display:none; }
.venue-controls.show { display:block; }
.venue-controls .slider-row { display:flex; align-items:center; gap:8px; margin-top:4px; }
.venue-controls .slider-row label { margin:0; width:50px; flex-shrink:0; }
.venue-controls input[type="range"] { flex:1; accent-color:var(--accent); height:4px; }
.venue-controls .mode-toggle { display:flex; gap:4px; margin-top:6px; }
.venue-warning { margin-top:6px; padding:6px 8px; border-radius:4px; font-size:10px;
                  background:rgba(232,167,53,.08); border:1px solid rgba(232,167,53,.2);
                  color:var(--warn); line-height:1.4; }

/* ── Plot tabs ───────────────────────────────────────────────── */
.plot-tabs { display:flex; gap:4px; margin-bottom:8px; flex-wrap:wrap; }
.plot-tab { padding:3px 10px; border-radius:4px; font-size:11px; cursor:pointer;
            background:var(--input-bg); border:1px solid var(--border); color:var(--dim); }
.plot-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.plot-tab .x { margin-left:4px; opacity:.6; }
.plot-tab .x:hover { opacity:1; }

/* ── Toolbar ─────────────────────────────────────────────────── */
#toolbar { position:absolute; top:12px; left:312px; right:12px; display:flex;
           gap:8px; z-index:10; pointer-events:none; }
#toolbar > * { pointer-events:auto; }
.toolbar-group { display:flex; gap:4px; background:var(--panel); border:1px solid var(--border);
                 border-radius:6px; padding:4px; }
.tool-info { margin-left:auto; background:var(--panel); border:1px solid var(--border);
             border-radius:6px; padding:4px 12px; font-size:11px; color:var(--dim); }

/* ── Viewport ────────────────────────────────────────────────── */
#viewport { flex:1; position:relative; overflow:hidden; cursor:grab; }
#viewport.grabbing { cursor:grabbing; }
#viewport.crosshair { cursor:crosshair; }
canvas#canvas { display:block; }

/* ── Scrollbars ──────────────────────────────────────────────── */
.scrollbar { position:absolute; z-index:5; border-radius:4px; opacity:0.3;
             transition:opacity .25s; }
.scrollbar:hover, .scrollbar.active { opacity:0.7; }
.scrollbar.horizontal { left:4px; right:14px; bottom:4px; height:8px;
                         background:rgba(255,255,255,.05); }
.scrollbar.vertical { top:4px; bottom:14px; right:4px; width:8px;
                       background:rgba(255,255,255,.05); }
.scrollbar .thumb { position:absolute; border-radius:4px;
                     background:rgba(200,200,220,.35); cursor:pointer; }
.scrollbar .thumb:hover { background:rgba(200,200,220,.55); }
.scrollbar.horizontal .thumb { height:100%; min-width:24px; }
.scrollbar.vertical .thumb { width:100%; min-height:24px; }

/* ── Magnifier Loupe ─────────────────────────────────────────── */
#loupe { position:absolute; top:50px; right:16px; width:160px; height:160px;
         border:2px solid var(--border); border-radius:8px; z-index:15;
         background:#111118; display:none; pointer-events:none;
         box-shadow:0 4px 20px rgba(0,0,0,.5); image-rendering:pixelated; }

/* ── All-toggle row ──────────────────────────────────────────── */
.all-toggle { display:flex; align-items:center; gap:8px; padding:4px 16px 8px;
              font-size:11px; color:var(--dim); }
.all-toggle span { cursor:pointer; }
.all-toggle span:hover { color:var(--accent); }
</style>
</head>
<body>

<div id="sidebar">
  <div class="panel-header">
    <h1>Stage Comparison</h1>
    <p>Overlay venue dimensions on your lighting plot</p>
  </div>

  <!-- Plot Management -->
  <div class="panel-section" id="plot-section">
    <h3>Lighting Plot</h3>
    <div class="plot-tabs" id="plot-tabs"></div>
    <div id="upload-area">
      <div class="icon">+</div>
      <p>Drop plot image or click to add</p>
      <input type="file" id="file-input" accept="image/*" style="display:none">
    </div>
  </div>

  <!-- Calibration (collapsible, hidden by default) -->
  <div class="panel-section" id="cal-section">
    <h3 class="cal-header" onclick="toggleCalPanel()">
      <span class="cal-arrow" id="cal-arrow">&#9654;</span> Calibration
    </h3>
    <div class="cal-body" id="cal-body">
      <div style="margin-top:10px;">
        <div class="cal-status" id="cal-s1">
          <div class="cal-dot done" id="cal-d1"></div>
          <span>Scale: <strong id="cal-scale-val">199 px/m</strong></span>
        </div>
        <div class="cal-row" id="cal-dist-row" style="display:none">
          <label style="width:auto;margin:0">Distance:</label>
          <input type="number" id="cal-dist" step="0.01" placeholder="metres">
          <button class="btn sm primary" onclick="applyCalibration()">Set</button>
        </div>
        <div class="cal-status" id="cal-s2" style="margin-top:4px">
          <div class="cal-dot done" id="cal-d2"></div>
          <span>Centre stage set</span>
        </div>
        <div class="cal-row" style="margin-top:6px">
          <label style="width:auto;margin:0">Plot depth:</label>
          <input type="number" id="cal-plot-depth" step="0.1" value="9" style="width:60px" onchange="updatePlotDepth()">
          <span style="font-size:11px;color:var(--dim)">m</span>
        </div>
        <div style="margin-top:10px; display:flex; gap:6px;">
          <button class="btn sm" onclick="startCalibration()">Recalibrate</button>
          <button class="btn sm" onclick="toggleGrid()">Grid</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Venues -->
  <div class="all-toggle" style="padding-top:12px">
    <span onclick="toggleAll(true)">Show all</span> &middot;
    <span onclick="toggleAll(false)">Hide all</span> &middot;
    <span onclick="soloNone()">Reset opacity</span>
  </div>
  <div id="venue-list"></div>
</div>

<div id="viewport">
  <canvas id="canvas"></canvas>
  <div id="toolbar">
    <div class="toolbar-group">
      <button class="btn sm" onclick="resetView()" title="Reset view (0)">Fit</button>
      <button class="btn sm" onclick="zoomIn()" title="Zoom in (+)">+</button>
      <button class="btn sm" onclick="zoomOut()" title="Zoom out (&minus;)">&minus;</button>
      <button class="btn sm" id="grid-btn" onclick="toggleGrid()" title="Toggle grid (G)">Grid</button>
    </div>
    <div class="tool-info" id="tool-info">Toggle venues to overlay</div>
  </div>
  <div class="scrollbar horizontal" id="scrollbar-h"><div class="thumb" id="thumb-h"></div></div>
  <div class="scrollbar vertical" id="scrollbar-v"><div class="thumb" id="thumb-v"></div></div>
  <canvas id="loupe" width="160" height="160"></canvas>
</div>

const venueState = VENUES.map(() => ({
  enabled: false, opacity: 0.30, expanded: false,

// ════════════════════════════════════════════════════════════════
// APP STATE
// ════════════════════════════════════════════════════════════════
// plot: { name, img, scale, cx, cy, dsY, plotDepth }
const plots = [];
let curPlot = -1;

let calMode = 'none';  // none | p1 | p2 | center
let calP1 = null, calP2 = null;

let pan = { x:0, y:0 };
let zoom = 1;
let dragging = false;
let dragStart = { x:0, y:0 };
let panStart  = { x:0, y:0 };
let showGrid = false;

const canvas   = document.getElementById('canvas');
const ctx      = canvas.getContext('2d');
const viewport = document.getElementById('viewport');

const sbH = document.getElementById('scrollbar-h');
const sbV = document.getElementById('scrollbar-v');
const thH = document.getElementById('thumb-h');
const thV = document.getElementById('thumb-v');

// ════════════════════════════════════════════════════════════════
// CANVAS SETUP
// ════════════════════════════════════════════════════════════════
function resizeCanvas() {
  canvas.width  = viewport.clientWidth;
  canvas.height = viewport.clientHeight;
  render();
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// ════════════════════════════════════════════════════════════════
// COORDINATE HELPERS
// ════════════════════════════════════════════════════════════════
function imgOrigin() {
  const plot = plots[curPlot];
  if (!plot || !plot.img) return { x:0, y:0 };
  return {
    x: (canvas.width  - plot.img.width)  / 2,
    y: (canvas.height - plot.img.height) / 2,
  };
}

function screenToWorld(sx, sy) {
  const W = canvas.width, H = canvas.height;
  return {
    x: (sx - W/2) / zoom + W/2 - pan.x,
    y: (sy - H/2) / zoom + H/2 - pan.y,
  };
}

function screenToImage(sx, sy) {
  const w = screenToWorld(sx, sy);
  const io = imgOrigin();
  return { x: w.x - io.x, y: w.y - io.y };
}

// ════════════════════════════════════════════════════════════════
// RENDERING
// ════════════════════════════════════════════════════════════════
function render() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  ctx.save();

  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2 + pan.x, -H/2 + pan.y);

  const plot = plots[curPlot];

  // Draw plot image
  if (plot && plot.img) {
    const io = imgOrigin();
    ctx.drawImage(plot.img, io.x, io.y);
  }

  // Grid
  if (showGrid && plot && plot.scale > 0 && plot.dsY != null) {
    drawGrid(plot, W, H);
  }

  // DS reference line (when any venue enabled)
  const anyEnabled = venueState.some(s => s.enabled);
  if (anyEnabled && plot && plot.dsY != null) {
    drawDSRefLine(plot);
  }

  // Venue overlays — DS-edge aligned
  if (plot && plot.scale > 0 && plot.dsY != null) {
    for (let i = 0; i < VENUES.length; i++) {
      if (!venueState[i].enabled) continue;
      drawVenue(VENUES[i], venueState[i], plot);
    }
  }

  // Calibration markers
  drawCalibration();

  // Centre stage marker
  if (plot && plot.cx != null && plot.cy != null) {
    drawCenterMark(plot);
  }

  ctx.restore();
  updateScrollbars();
}

// ── DS reference line ───────────────────────────────────────────
function drawDSRefLine(plot) {
  const io = imgOrigin();
  const dsY = io.y + plot.dsY;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,120,120,0.2)';
  ctx.lineWidth = 1.5 / zoom;
  ctx.setLineDash([6/zoom, 4/zoom]);
  ctx.beginPath();
  ctx.moveTo(io.x - 200, dsY);
  ctx.lineTo(io.x + (plot.img ? plot.img.width : 0) + 200, dsY);
  ctx.stroke();
  ctx.setLineDash([]);
  // Label
  const dsFont = Math.max(13/zoom, 10);
  ctx.font = `bold ${dsFont}px system-ui`; ctx.textAlign = 'left';
  const dsLabelX = io.x + (plot.img ? plot.img.width : 0) + 10, dsLabelY = dsY + 4/zoom;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/zoom;
  ctx.strokeText('DS Edge (0m)', dsLabelX, dsLabelY);
  ctx.fillStyle = 'rgba(255,120,120,0.6)';
  ctx.fillText('DS Edge (0m)', dsLabelX, dsLabelY);
  ctx.restore();
}

// ── Grid ────────────────────────────────────────────────────────
function drawGrid(plot, W, H) {
  const s = plot.scale;
  const io = imgOrigin();
  const ocx = io.x + plot.cx;
  const dsY = io.y + plot.dsY;
  ctx.save();

  const range = 50;
  // 1m grid
  ctx.strokeStyle = 'rgba(255,255,255,0.06)';
  ctx.lineWidth = 1 / zoom;
  for (let i = -range; i <= range; i++) {
    const x = ocx + i * s;
    ctx.beginPath(); ctx.moveTo(x, dsY - range*s); ctx.lineTo(x, dsY + range*s); ctx.stroke();
    const y = dsY - i * s;  // 0 at DS, positive upstage (lower y)
    ctx.beginPath(); ctx.moveTo(ocx - range*s, y); ctx.lineTo(ocx + range*s, y); ctx.stroke();
  }
  // 5m grid
  ctx.strokeStyle = 'rgba(255,255,255,0.12)';
  for (let i = -range; i <= range; i += 5) {
    const x = ocx + i * s;
    ctx.beginPath(); ctx.moveTo(x, dsY - range*s); ctx.lineTo(x, dsY + range*s); ctx.stroke();
    const y = dsY - i * s;
    ctx.beginPath(); ctx.moveTo(ocx - range*s, y); ctx.lineTo(ocx + range*s, y); ctx.stroke();
  }
  // Axes: vertical through centre, horizontal at DS edge
  ctx.strokeStyle = 'rgba(74,158,255,0.25)';
  ctx.lineWidth = 1.5 / zoom;
  ctx.beginPath(); ctx.moveTo(ocx, dsY - range*s); ctx.lineTo(ocx, dsY + range*s); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ocx - range*s, dsY); ctx.lineTo(ocx + range*s, dsY); ctx.stroke();
  ctx.restore();
}

// ── Centre stage marker ─────────────────────────────────────────
function drawCenterMark(plot) {
  const io = imgOrigin();
  const x = io.x + plot.cx, y = io.y + plot.cy;
  const r = 6 / zoom;
  ctx.save();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5 / zoom;
  ctx.beginPath(); ctx.moveTo(x - r*2, y); ctx.lineTo(x + r*2, y); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x, y - r*2); ctx.lineTo(x, y + r*2); ctx.stroke();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.stroke();
  const csFont = Math.max(13/zoom, 10);
  ctx.font = `bold ${csFont}px system-ui`; ctx.textAlign = 'left';
  const csLx = x + r*2 + 2/zoom, csLy = y + 4/zoom;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/zoom;
  ctx.strokeText('CS', csLx, csLy);
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('CS', csLx, csLy);
  ctx.restore();
}

// ── Calibration markers ─────────────────────────────────────────
function drawCalibration() {
  const io = imgOrigin();
  const r = 5 / zoom;
  if (calP1) {
    const x = io.x + calP1.x, y = io.y + calP1.y;
    ctx.save(); ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 2/zoom;
    ctx.beginPath(); ctx.moveTo(x-r, y); ctx.lineTo(x+r, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-r); ctx.lineTo(x, y+r); ctx.stroke();
    ctx.restore();
  }
  if (calP2) {
    const x = io.x + calP2.x, y = io.y + calP2.y;
    ctx.save(); ctx.strokeStyle = '#4a9eff'; ctx.lineWidth = 2/zoom;
    ctx.beginPath(); ctx.moveTo(x-r, y); ctx.lineTo(x+r, y); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y-r); ctx.lineTo(x, y+r); ctx.stroke();
    ctx.restore();
  }
  if (calP1 && calP2) {
    ctx.save(); ctx.strokeStyle = 'rgba(74,158,255,0.5)'; ctx.lineWidth = 1.5/zoom;
    ctx.setLineDash([4/zoom, 4/zoom]);
    ctx.beginPath(); ctx.moveTo(io.x+calP1.x, io.y+calP1.y);
    ctx.lineTo(io.x+calP2.x, io.y+calP2.y); ctx.stroke();
    ctx.setLineDash([]); ctx.restore();
  }
}

// ════════════════════════════════════════════════════════════════
// VENUE OVERLAY — DS-EDGE ALIGNED
// All DS edges line up at plot.dsY. Stages extend upstage (lower y).
// ════════════════════════════════════════════════════════════════
function drawVenue(venue, state, plot) {
  const geo = venue.detailed || venue.basic;
  const s = plot.scale;
  const io = imgOrigin();
  const cx  = io.x + plot.cx;    // centre-stage X in canvas
  const dsY = io.y + plot.dsY;   // DS reference line in canvas
  const alpha = state.opacity;
  const rgb = hexToRgb(venue.color);

  ctx.save();

  // Main stage
  ctx.fillStyle   = `rgba(${rgb},${alpha * 0.4})`;
  ctx.strokeStyle = `rgba(${rgb},${Math.min(alpha + 0.3, 1)})`;
  ctx.lineWidth   = 2 / zoom;

  if (geo.stage.type === 'rect') {
    const w = geo.stage.w, d = geo.stage.d;
    const x = cx - (w/2)*s;
    const y = dsY - d*s;          // extends upstage from DS edge
    ctx.fillRect(x, y, w*s, d*s);
    ctx.strokeRect(x, y, w*s, d*s);
  } else if (geo.stage.type === 'trapezoid') {
    const { dsW, usW, d } = geo.stage;
    ctx.beginPath();
    ctx.moveTo(cx - (dsW/2)*s, dsY);           // DS-SR
    ctx.lineTo(cx + (dsW/2)*s, dsY);           // DS-SL
    ctx.lineTo(cx + (usW/2)*s, dsY - d*s);    // US-SL
    ctx.lineTo(cx - (usW/2)*s, dsY - d*s);    // US-SR
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }

  // Features
  for (const f of geo.features) {
    if (f.type === 'wing')    drawWing(ctx, f, geo.stage, cx, dsY, s, rgb, alpha, zoom);
    if (f.type === 'pros')    drawProscenium(ctx, f, geo.stage, cx, dsY, s, rgb, alpha, zoom);
    if (f.type === 'curtain') drawCurtain(ctx, f, geo.stage, cx, dsY, s, rgb, alpha, zoom);
    if (f.type === 'area')    drawArea(ctx, f, cx, dsY, s, rgb, alpha, zoom);
  }

  // Label above US edge
  const stageD = geo.stage.d;
  const nameFont = Math.max(14/zoom, 11);
  const dimFont  = Math.max(12/zoom, 9);
  const labelY = dsY - stageD*s - 8/zoom;
  ctx.textAlign = 'center';
  // Venue name
  ctx.font = `bold ${nameFont}px system-ui`;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/zoom;
  ctx.strokeText(`${venue.name} — ${venue.venue}`, cx, labelY);
  ctx.fillStyle = `rgba(${rgb},${Math.min(alpha + 0.5, 1)})`;
  ctx.fillText(`${venue.name} — ${venue.venue}`, cx, labelY);
  // Dimensions
  ctx.font = `bold ${dimFont}px system-ui`;
  const dimText = geo.stage.type === 'rect'
    ? `${geo.stage.w}m × ${geo.stage.d}m`
    : `DS ${geo.stage.dsW.toFixed(1)}m → US ${geo.stage.usW.toFixed(1)}m × ${geo.stage.d}m`;
  ctx.strokeText(dimText, cx, labelY + 14/zoom);
  ctx.fillStyle = `rgba(${rgb},${Math.min(alpha + 0.3, 0.9)})`;
  ctx.fillText(dimText, cx, labelY + 14/zoom);
  ctx.restore();
}

function drawWing(ctx, f, stage, cx, dsY, s, rgb, alpha, z) {
  const stageW = stage.type === 'trapezoid' ? Math.max(stage.dsW, stage.usW) : stage.w;
  const stageD = stage.d;
  const usEdge = dsY - stageD * s;

  let wingTop, wingBot;
  if (f.zOff === 'us') {
    wingTop = usEdge;
    wingBot = usEdge + f.d * s;
  } else {
    wingBot = dsY - (f.zOff || 0) * s;
    wingTop = wingBot - f.d * s;
  }

  let wingX, wingW;
  if (f.side === 'sl') { wingX = cx + (stageW/2)*s; wingW = f.w * s; }
  else                 { wingX = cx - (stageW/2)*s - f.w*s; wingW = f.w * s; }

  ctx.save();
  ctx.fillStyle   = `rgba(${rgb},${alpha * 0.25})`;
  ctx.strokeStyle = `rgba(${rgb},${Math.min(alpha+0.2,0.8)})`;
  ctx.lineWidth   = 1.5 / z;
  ctx.setLineDash([4/z, 3/z]);
  ctx.fillRect(wingX, wingTop, wingW, wingBot - wingTop);
  ctx.strokeRect(wingX, wingTop, wingW, wingBot - wingTop);
  ctx.setLineDash([]);
  const wFont = Math.max(12/z, 9);
  ctx.font = `bold ${wFont}px system-ui`; ctx.textAlign = 'center';
  const wLx = wingX + wingW/2, wLy = wingTop + (wingBot - wingTop)/2 + 3/z;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/z;
  ctx.strokeText(f.label, wLx, wLy);
  ctx.fillStyle = `rgba(${rgb},${Math.min(alpha+0.3,0.9)})`;
  ctx.fillText(f.label, wLx, wLy);
  ctx.restore();
}

function drawProscenium(ctx, f, stage, cx, dsY, s, rgb, alpha, z) {
  const stageW = stage.type === 'trapezoid' ? stage.dsW : stage.w;
  const prosHW  = (f.w/2)*s;
  const stageHW = (stageW/2)*s;
  if (stageHW > prosHW) {
    ctx.save();
    ctx.fillStyle   = `rgba(${rgb},${alpha * 0.6})`;
    ctx.strokeStyle = `rgba(${rgb},${Math.min(alpha+0.3,1)})`;
    ctx.lineWidth   = 2/z;
    const wallH = 15/z;
    // SR wall
    ctx.fillRect(cx - stageHW, dsY, stageHW - prosHW, wallH);
    ctx.strokeRect(cx - stageHW, dsY, stageHW - prosHW, wallH);
    // SL wall
    ctx.fillRect(cx + prosHW, dsY, stageHW - prosHW, wallH);
    ctx.strokeRect(cx + prosHW, dsY, stageHW - prosHW, wallH);
    ctx.restore();
  }
  // Pros line at DS edge
  ctx.save();
  ctx.strokeStyle = `rgba(${rgb},${Math.min(alpha+0.4,1)})`;
  ctx.lineWidth = 2.5/z;
  ctx.beginPath(); ctx.moveTo(cx - prosHW, dsY); ctx.lineTo(cx + prosHW, dsY); ctx.stroke();
  const pFont = Math.max(12/z, 9);
  ctx.font = `bold ${pFont}px system-ui`; ctx.textAlign = 'center';
  const pLy = dsY + 12/z + 15/z;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/z;
  ctx.strokeText(`Pros ${f.w}m`, cx, pLy);
  ctx.fillStyle = `rgba(${rgb},${Math.min(alpha+0.3,0.9)})`;
  ctx.fillText(`Pros ${f.w}m`, cx, pLy);
  ctx.restore();
}

function drawCurtain(ctx, f, stage, cx, dsY, s, rgb, alpha, z) {
  let stageW;
  if (stage.type === 'trapezoid') {
    const t = Math.min(f.dist / stage.d, 1);
    stageW = stage.dsW + (stage.usW - stage.dsW) * t;
  } else { stageW = stage.w; }
  const curtainY = dsY - f.dist * s;  // dist from DS, upstage
  const c = f.obs ? '255,60,60' : rgb;
  ctx.save();
  ctx.strokeStyle = `rgba(${c},${Math.min(alpha+0.3,1)})`;
  ctx.lineWidth = 2/z; ctx.setLineDash([6/z, 4/z]);
  ctx.beginPath(); ctx.moveTo(cx - (stageW/2)*s, curtainY);
  ctx.lineTo(cx + (stageW/2)*s, curtainY); ctx.stroke();
  ctx.setLineDash([]);
  const cFont = Math.max(12/z, 9);
  ctx.font = `bold ${cFont}px system-ui`; ctx.textAlign = 'left';
  const curtainText = `${f.label} (${f.dist}m from DS)`;
  const ctX = cx + (stageW/2)*s + 4/z, ctY = curtainY + 4/z;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/z;
  ctx.strokeText(curtainText, ctX, ctY);
  ctx.fillStyle = f.obs ? '#ff6666' : `rgba(${c},${Math.min(alpha+0.3,0.9)})`;
  ctx.fillText(curtainText, ctX, ctY);
  ctx.restore();
}

function drawArea(ctx, f, cx, dsY, s, rgb, alpha, z) {
  // f: { type:'area', label, x, z, w, d, obs }
  // x: from centre (SL+), z: from DS edge (US+)
  const ax = cx + f.x * s - (f.w/2) * s;
  const ay = dsY - f.z * s - (f.d/2) * s;
  const c = f.obs ? '255,60,60' : rgb;
  ctx.save();
  ctx.fillStyle   = `rgba(${c},${f.obs ? alpha*0.25 : alpha*0.15})`;
  ctx.strokeStyle = `rgba(${c},${Math.min(alpha+0.2, f.obs ? 0.9 : 0.7)})`;
  ctx.lineWidth = (f.obs ? 2 : 1.5) / z;
  ctx.setLineDash([3/z, 3/z]);
  ctx.fillRect(ax, ay, f.w*s, f.d*s);
  ctx.strokeRect(ax, ay, f.w*s, f.d*s);
  ctx.setLineDash([]);
  const aFont = Math.max(11/z, 9);
  ctx.font = `bold ${aFont}px system-ui`; ctx.textAlign = 'center';
  const aLx = ax + (f.w*s)/2, aLy = ay + (f.d*s)/2 + 3/z;
  ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = 3/z;
  ctx.strokeText(f.label, aLx, aLy);
  ctx.fillStyle = f.obs ? '#ff6666' : `rgba(${c},${Math.min(alpha+0.3,0.9)})`;
  ctx.fillText(f.label, aLx, aLy);
  ctx.restore();
}

function hexToRgb(hex) {
  return `${parseInt(hex.slice(1,3),16)},${parseInt(hex.slice(3,5),16)},${parseInt(hex.slice(5,7),16)}`;
}

// ════════════════════════════════════════════════════════════════
// SCROLLBARS
// ════════════════════════════════════════════════════════════════
let sbDrag = null;

function getContentBounds() {
  const plot = plots[curPlot];
  if (!plot || !plot.img) return null;
  const W = canvas.width, H = canvas.height;
  const imgW = plot.img.width, imgH = plot.img.height;
  const pad = 300;
  return {
    left:   (W - imgW)/2 - pad,  right:  (W + imgW)/2 + pad,
    top:    (H - imgH)/2 - pad,  bottom: (H + imgH)/2 + pad,
  };
}

function getViewBounds() {
  const W = canvas.width, H = canvas.height;
  return {
    left:   W/2 - W/(2*zoom) - pan.x,  right:  W/2 + W/(2*zoom) - pan.x,
    top:    H/2 - H/(2*zoom) - pan.y,  bottom: H/2 + H/(2*zoom) - pan.y,
  };
}

function updateScrollbars() {
  const cb = getContentBounds();
  if (!cb) { sbH.style.display = sbV.style.display = 'none'; return; }
  sbH.style.display = sbV.style.display = '';
  const vb = getViewBounds();

  // Horizontal
  const totalW = cb.right - cb.left, viewW = vb.right - vb.left;
  const trackW = sbH.clientWidth;
  if (viewW >= totalW) { thH.style.display = 'none'; }
  else {
    thH.style.display = '';
    const thumbW = Math.max(24, trackW * (viewW / totalW));
    const frac = Math.max(0, Math.min(1, (vb.left - cb.left) / (totalW - viewW)));
    thH.style.width = thumbW + 'px';
    thH.style.left  = frac * (trackW - thumbW) + 'px';
  }

  // Vertical
  const totalH = cb.bottom - cb.top, viewH = vb.bottom - vb.top;
  const trackH = sbV.clientHeight;
  if (viewH >= totalH) { thV.style.display = 'none'; }
  else {
    thV.style.display = '';
    const thumbH = Math.max(24, trackH * (viewH / totalH));
    const frac = Math.max(0, Math.min(1, (vb.top - cb.top) / (totalH - viewH)));
    thV.style.height = thumbH + 'px';
    thV.style.top    = frac * (trackH - thumbH) + 'px';
  }
}

function startSbDrag(axis, e) {
  e.preventDefault(); e.stopPropagation();
  const cb = getContentBounds(); if (!cb) return;
  const vb = getViewBounds();
  const isH = axis === 'h';
  const totalLen = isH ? cb.right - cb.left : cb.bottom - cb.top;
  const viewLen  = isH ? vb.right - vb.left : vb.bottom - vb.top;
  const trackLen = isH ? sbH.clientWidth : sbV.clientHeight;
  const thumbLen = isH ? thH.clientWidth : thV.clientHeight;
  sbDrag = { axis, totalLen, viewLen, trackLen, thumbLen,
    startMouse: isH ? e.clientX : e.clientY,
    startThumb: isH ? parseFloat(thH.style.left)||0 : parseFloat(thV.style.top)||0,
    contentStart: isH ? cb.left : cb.top,
  };
  (isH ? sbH : sbV).classList.add('active');
}

thH.addEventListener('mousedown', e => startSbDrag('h', e));
thV.addEventListener('mousedown', e => startSbDrag('v', e));

document.addEventListener('mousemove', e => {
  if (!sbDrag) return;
  const d = sbDrag, isH = d.axis === 'h';
  const delta = (isH ? e.clientX : e.clientY) - d.startMouse;
  const newThumb = Math.max(0, Math.min(d.trackLen - d.thumbLen, d.startThumb + delta));
  const frac = d.trackLen <= d.thumbLen ? 0 : newThumb / (d.trackLen - d.thumbLen);
  const newViewStart = d.contentStart + frac * (d.totalLen - d.viewLen);
  const W = canvas.width, H = canvas.height;
  if (isH) pan.x = W/2 - W/(2*zoom) - newViewStart;
  else     pan.y = H/2 - H/(2*zoom) - newViewStart;
  render();
});

document.addEventListener('mouseup', () => {
  if (sbDrag) { (sbDrag.axis === 'h' ? sbH : sbV).classList.remove('active'); sbDrag = null; }
});

sbH.addEventListener('mousedown', e => {
  if (e.target === thH) return;
  const rect = sbH.getBoundingClientRect();
  const cb = getContentBounds(); if (!cb) return;
  const vb = getViewBounds();
  const totalW = cb.right - cb.left, viewW = vb.right - vb.left;
  const frac = (e.clientX - rect.left) / sbH.clientWidth;
  pan.x = canvas.width/2 - canvas.width/(2*zoom) - (cb.left + frac*totalW - viewW/2);
  render();
});
sbV.addEventListener('mousedown', e => {
  if (e.target === thV) return;
  const rect = sbV.getBoundingClientRect();
  const cb = getContentBounds(); if (!cb) return;
  const vb = getViewBounds();
  const totalH = cb.bottom - cb.top, viewH = vb.bottom - vb.top;
  const frac = (e.clientY - rect.top) / sbV.clientHeight;
  pan.y = canvas.height/2 - canvas.height/(2*zoom) - (cb.top + frac*totalH - viewH/2);
  render();
});

// ════════════════════════════════════════════════════════════════
// MAGNIFIER LOUPE
// ════════════════════════════════════════════════════════════════
function updateLoupe(e) {
  if (calMode === 'none') { loupe.style.display = 'none'; return; }
  const plot = plots[curPlot];
  if (!plot || !plot.img) { loupe.style.display = 'none'; return; }
  loupe.style.display = 'block';

  const rect = canvas.getBoundingClientRect();
  const ip = screenToImage(e.clientX - rect.left, e.clientY - rect.top);
  const lW = loupe.width, lH = loupe.height;
  const mag = 4, srcW = lW/mag, srcH = lH/mag;

  loupeCtx.fillStyle = '#111118';
  loupeCtx.fillRect(0, 0, lW, lH);
  loupeCtx.drawImage(plot.img, ip.x - srcW/2, ip.y - srcH/2, srcW, srcH, 0, 0, lW, lH);

  loupeCtx.strokeStyle = 'rgba(74,158,255,0.7)'; loupeCtx.lineWidth = 1;
  loupeCtx.beginPath();
  loupeCtx.moveTo(lW/2, 0); loupeCtx.lineTo(lW/2, lH);
  loupeCtx.moveTo(0, lH/2); loupeCtx.lineTo(lW, lH/2);
  loupeCtx.stroke();
  loupeCtx.fillStyle = 'rgba(74,158,255,0.9)';
  loupeCtx.beginPath(); loupeCtx.arc(lW/2, lH/2, 2.5, 0, Math.PI*2); loupeCtx.fill();
  loupeCtx.fillStyle = 'rgba(200,200,220,0.5)';
  loupeCtx.font = '9px system-ui'; loupeCtx.textAlign = 'left';
  loupeCtx.fillText(`${Math.round(ip.x)}, ${Math.round(ip.y)}`, 4, lH - 4);
}

// ════════════════════════════════════════════════════════════════
// INTERACTION: PAN / ZOOM
// ════════════════════════════════════════════════════════════════
viewport.addEventListener('mousedown', e => {
  if (e.target === thH || e.target === thV) return;
  if (e.target === sbH || e.target === sbV) return;
  if (calMode !== 'none') { handleCalClick(e); return; }
  dragging = true;
  dragStart = { x: e.clientX, y: e.clientY };
  panStart  = { x: pan.x,    y: pan.y };
  viewport.classList.add('grabbing');
});

viewport.addEventListener('mousemove', e => {
  updateLoupe(e);
  if (!dragging) return;
  pan.x = panStart.x + (e.clientX - dragStart.x) / zoom;
  pan.y = panStart.y + (e.clientY - dragStart.y) / zoom;
  render();
});

viewport.addEventListener('mouseup', () => { dragging = false; viewport.classList.remove('grabbing'); });
viewport.addEventListener('mouseleave', () => {
  dragging = false; viewport.classList.remove('grabbing');
  if (calMode !== 'none') loupe.style.display = 'none';
});

viewport.addEventListener('wheel', e => {
  e.preventDefault();
  const factor = e.deltaY < 0 ? 1.08 : 1/1.08;
  const oldZoom = zoom;
  zoom = Math.max(0.05, Math.min(20, zoom * factor));
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  pan.x += (mx - canvas.width/2)  * (1/oldZoom - 1/zoom);
  pan.y += (my - canvas.height/2) * (1/oldZoom - 1/zoom);
  render();
}, { passive: false });

function resetView() {
  const plot = plots[curPlot];
  if (plot && plot.img) {
    zoom = Math.min(canvas.width / plot.img.width, canvas.height / plot.img.height) * 0.92;
  } else { zoom = 1; }
  pan = { x:0, y:0 }; render();
}
function zoomIn()  { zoom = Math.min(20, zoom * 1.3); render(); }
function zoomOut() { zoom = Math.max(0.05, zoom / 1.3); render(); }

// ════════════════════════════════════════════════════════════════
// CALIBRATION
// ════════════════════════════════════════════════════════════════
function toggleCalPanel() {
  document.getElementById('cal-body').classList.toggle('open');
  document.getElementById('cal-arrow').classList.toggle('open');
}

function startCalibration() {
  document.getElementById('cal-body').classList.add('open');
  document.getElementById('cal-arrow').classList.add('open');
  calMode = 'p1'; calP1 = null; calP2 = null;
  viewport.classList.add('crosshair');
  updateCalUI(); updateInfo('Click the first calibration point');
  render();
}

function handleCalClick(e) {
  const rect = canvas.getBoundingClientRect();
  const ip = screenToImage(e.clientX - rect.left, e.clientY - rect.top);

  if (calMode === 'p1') {
    calP1 = { x:ip.x, y:ip.y }; calMode = 'p2';
    updateCalUI(); updateInfo('Click the second calibration point'); render();
  } else if (calMode === 'p2') {
    calP2 = { x:ip.x, y:ip.y }; calMode = 'none';
    viewport.classList.remove('crosshair');
    document.getElementById('cal-dist-row').style.display = 'flex';
    document.getElementById('cal-dist').focus();
    updateCalUI(); updateInfo('Enter the real-world distance (metres)'); render();
  } else if (calMode === 'center') {
    const plot = plots[curPlot];
    if (plot) {
      plot.cx = ip.x;
      plot.cy = ip.y;
      const depth = plot.plotDepth || 9;
      plot.dsY = ip.y + (depth/2) * plot.scale;
    }
    calMode = 'none';
    viewport.classList.remove('crosshair');
    loupe.style.display = 'none';
    updateCalUI(); updateInfo('Calibrated — toggle venues to overlay'); render();
  }
}

function applyCalibration() {
  const dist = parseFloat(document.getElementById('cal-dist').value);
  if (!dist || dist <= 0 || !calP1 || !calP2) return;
  const pxDist = Math.sqrt((calP2.x-calP1.x)**2 + (calP2.y-calP1.y)**2);
  const plot = plots[curPlot];
  if (plot) plot.scale = pxDist / dist;
  document.getElementById('cal-dist-row').style.display = 'none';
  calMode = 'center';
  viewport.classList.add('crosshair');
  updateCalUI(); updateInfo(`Scale: ${plot.scale.toFixed(1)} px/m — now click centre stage`); render();
}

function updatePlotDepth() {
  const depth = parseFloat(document.getElementById('cal-plot-depth').value) || 9;
  const plot = plots[curPlot];
  if (plot) {
    plot.plotDepth = depth;
    if (plot.cy != null && plot.scale > 0) {
      plot.dsY = plot.cy + (depth/2) * plot.scale;
    }
    render();
  }
}

function updateCalUI() {
  const d1 = document.getElementById('cal-d1');
  const d2 = document.getElementById('cal-d2');
  const plot = plots[curPlot];
  const hasScale = plot && plot.scale > 0;
  const hasCx    = plot && plot.cx != null;

  d1.className = 'cal-dot ' + (hasScale ? 'done' : (calMode==='p1'||calMode==='p2') ? 'active' : 'pending');
  d2.className = 'cal-dot ' + (hasCx ? 'done' : calMode==='center' ? 'active' : 'pending');
  document.getElementById('cal-s1').querySelector('span').innerHTML = hasScale
    ? `Scale: <strong>${plot.scale.toFixed(1)} px/m</strong>` : 'Click two points on a known distance';
  document.getElementById('cal-s2').querySelector('span').textContent = hasCx ? 'Centre stage set' : 'Click centre stage';
  if (plot) document.getElementById('cal-plot-depth').value = plot.plotDepth || 9;
}

function updateInfo(msg) { document.getElementById('tool-info').textContent = msg; }

function toggleGrid() {
  showGrid = !showGrid;
  document.getElementById('grid-btn').classList.toggle('active', showGrid);
  render();
}

// ════════════════════════════════════════════════════════════════
// PLOT MANAGEMENT
// ════════════════════════════════════════════════════════════════
const uploadArea = document.getElementById('upload-area');
const fileInput  = document.getElementById('file-input');

uploadArea.addEventListener('click', () => fileInput.click());
uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault(); uploadArea.classList.remove('dragover');
  if (e.dataTransfer.files.length) loadImage(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) loadImage(fileInput.files[0]);
  fileInput.value = '';
});

function loadImage(file) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const name = file.name.replace(/\.[^.]+$/, '') || `Plot ${plots.length+1}`;
      plots.push({ name, img, scale: 0, cx: null, cy: null, dsY: null, plotDepth: 9 });
      curPlot = plots.length - 1;
      updatePlotTabs();
      pan = { x:0, y:0 };
      zoom = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
      startCalibration();
      render();
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

function switchPlot(i) { curPlot = i; updatePlotTabs(); updateCalUI(); render(); }
function removePlot(i) {
  plots.splice(i, 1);
  if (curPlot >= plots.length) curPlot = plots.length - 1;
  updatePlotTabs(); updateCalUI(); render();
}

function updatePlotTabs() {
  const tabs = document.getElementById('plot-tabs');
  tabs.innerHTML = '';
  plots.forEach((p, i) => {
    const tab = document.createElement('div');
    tab.className = 'plot-tab' + (i === curPlot ? ' active' : '');
    tab.innerHTML = `${p.name}${plots.length > 1 ? '<span class="x" data-i="'+i+'">×</span>' : ''}`;
    tab.addEventListener('click', e => {
      if (e.target.classList.contains('x')) { removePlot(i); return; }
      switchPlot(i);
    });
    tabs.appendChild(tab);
  });
}

// ════════════════════════════════════════════════════════════════
// VENUE UI
// ════════════════════════════════════════════════════════════════
function buildVenueList() {
  const list = document.getElementById('venue-list');
  list.innerHTML = '';
  VENUES.forEach((v, i) => {
    const el = document.createElement('div');
    el.className = 'venue-item';
    const st = venueState[i];
    const geo = (v.detailed || v.basic).stage;
    // Color-code each dimension vs PLOT_REF
    function dimColor(val, ref) {
      const diff = val - ref;
      if (diff < -1) return '#ff4444';       // red: notably smaller
      if (diff < 0)  return '#e8a735';       // yellow: within ~1m smaller
      return '#2dd4a8';                       // green: same or larger
    }
    let dims, wSmaller = false, dSmaller = false;
    if (geo.type === 'rect') {
      const wC = dimColor(geo.w, PLOT_REF.w);
      const dC = dimColor(geo.d, PLOT_REF.d);
      wSmaller = geo.w < PLOT_REF.w - 1;
      dSmaller = geo.d < PLOT_REF.d - 1;
      dims = `<span style="color:${wC}">${geo.w}m</span> × <span style="color:${dC}">${geo.d}m</span>`;
    } else {
      const dsC = dimColor(geo.dsW, PLOT_REF.w);
      const usC = dimColor(geo.usW, PLOT_REF.w);
      const dC  = dimColor(geo.d, PLOT_REF.d);
      wSmaller = geo.dsW < PLOT_REF.w - 1 || geo.usW < PLOT_REF.w - 1;
      dSmaller = geo.d < PLOT_REF.d - 1;
      dims = `DS <span style="color:${dsC}">${geo.dsW.toFixed(1)}m</span> → US <span style="color:${usC}">${geo.usW.toFixed(1)}m</span> × <span style="color:${dC}">${geo.d}m</span>`;
    }
    const hasSmaller = wSmaller || dSmaller;
    const sizeWarning = hasSmaller
      ? `<div class="venue-warning" style="border-color:rgba(255,68,68,.3);background:rgba(255,68,68,.08);color:#ff6666;">⚠ Stage is smaller than default plot (${PLOT_REF.w}×${PLOT_REF.d}m)${wSmaller && dSmaller ? ' in both width and depth' : wSmaller ? ' in width' : ' in depth'}</div>`
      : '';
    const feats = (v.detailed || v.basic).features.map(f => {
      if (f.type === 'wing')    return f.label;
      if (f.type === 'pros')    return `Pros ${f.w}m`;
      if (f.type === 'curtain') return f.label;
    }).filter(Boolean).join(' · ');

    const hasDetailed = !!v.detailed;
    const warningHtml = v.warnings && v.warnings.length
      ? v.warnings.map(w => `<div class="venue-warning">${w}</div>`).join('')
      : '';
    // Warning triangles next to venue name
    const hasVenueWarnings = v.warnings && v.warnings.length > 0;
    const indicators = [
      hasSmaller ? '<span title="Stage smaller than plot" style="color:#ff4444;font-size:11px;flex-shrink:0">&#9650;</span>' : '',
      hasVenueWarnings ? '<span title="Venue warnings — expand for details" style="color:#e8a735;font-size:11px;flex-shrink:0">&#9650;</span>' : '',
    ].filter(Boolean).join('');

    el.innerHTML = `
      <div class="venue-row">
        <div class="venue-swatch ${st.enabled?'on':''}" style="background:${v.color}" data-i="${i}">${st.enabled?'&#10003;':''}</div>
        <span class="venue-name ${st.enabled?'':'disabled'}" data-i="${i}">${v.name}
          <span style="color:var(--dim);font-weight:400">— ${v.venue}</span></span>
        ${indicators}
      </div>
      <div class="venue-detail">${dims}${feats ? ' · '+feats : ''}${hasDetailed ? '' : ' · <span style="color:var(--dim);font-style:italic">basic only</span>'}</div>
      <div class="venue-controls ${st.expanded?'show':''}" id="vc-${i}">
        <div class="slider-row">
          <label>Opacity</label>
          <input type="range" min="0" max="100" value="${Math.round(st.opacity*100)}" data-i="${i}" class="opacity-slider">
          <span style="width:28px;text-align:right;font-size:11px;color:var(--dim)" id="op-val-${i}">${Math.round(st.opacity*100)}%</span>
        </div>
        ${sizeWarning}
        ${warningHtml}
      </div>
    `;

    el.querySelector('.venue-swatch').addEventListener('click', () => {
      st.enabled = !st.enabled; buildVenueList(); render();
    });
    el.querySelector('.venue-name').addEventListener('click', () => {
      st.expanded = !st.expanded;
      if (!st.enabled) st.enabled = true;
      buildVenueList(); render();
    });
    const slider = el.querySelector('.opacity-slider');
    if (slider) {
      slider.addEventListener('input', () => {
        st.opacity = parseInt(slider.value) / 100;
        document.getElementById(`op-val-${i}`).textContent = slider.value + '%';
        render();
      });
    }
    list.appendChild(el);
  });
}

function toggleAll(on) { venueState.forEach(s => s.enabled = on); buildVenueList(); render(); }
function soloNone() { venueState.forEach(s => { s.opacity = 0.30; }); buildVenueList(); render(); }

// ════════════════════════════════════════════════════════════════
// KEYBOARD
// ════════════════════════════════════════════════════════════════
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'g') toggleGrid();
  if (e.key === '0') resetView();
  if (e.key === '=' || e.key === '+') zoomIn();
  if (e.key === '-') zoomOut();
  if (e.key === 'Escape') {
    calMode = 'none'; viewport.classList.remove('crosshair');
    loupe.style.display = 'none'; updateCalUI(); render();
  }
});

// ════════════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════════════
(function init() {
  buildVenueList();
  const img = new Image();
  img.onload = () => {
    plots.push({
      name: 'Default 12×9m Plot',
      img,
      scale: PRELOAD_SCALE,
      cx: PRELOAD_CX,
      cy: PRELOAD_CY,
      dsY: PRELOAD_DSY,
      plotDepth: PRELOAD_DEPTH,
    });
    curPlot = 0;
    updatePlotTabs();
    updateCalUI();
    zoom = Math.min(canvas.width / img.width, canvas.height / img.height) * 0.92;
    pan = { x:0, y:0 };
    updateInfo('Toggle venues to overlay on your plot');
    render();
  };
  img.src = PRELOAD_B64;
})();
</script>
</body>
